[alembic]
# Path to migration scripts
script_location = alembic
# Database URL – overridden by the DATABASE_URL environment variable (env.py),
# which lets the same config target the embedded DB, Docker, or hosted Postgres.
# Default below points at the bundled embedded PostgreSQL (scripts/start-pg.sh).
sqlalchemy.url = postgresql+asyncpg://memory:memory@localhost:5433/memory

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
