[pytest]
asyncio_mode = auto
# The app owns a process-global async engine (memory.database.engine) whose
# asyncpg connection pool binds to an event loop. With pytest-asyncio's default
# per-test (function-scoped) loops, that pool gets detached across tests and
# surfaces as "Task exception was never retrieved" at teardown. Pin the loop to
# the whole session so the engine's pool stays on a single loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::ResourceWarning
